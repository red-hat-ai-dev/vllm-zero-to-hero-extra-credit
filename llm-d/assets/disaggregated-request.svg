<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 704" role="img" aria-labelledby="title description">
  <title id="title">Follow one request through separate workers</title>
  <desc id="description">The client sends a request to the proxy, which consults the EPP and routes to a decode-side sidecar. The sidecar requests remote prefill and forwards transfer metadata to the decoder. The decoder retrieves bulk KV state via NIXL, generates output, and streams it through the sidecar and proxy back to the client. Dashed response line abstracts these return hops.</desc>
  <defs>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ee0000" stroke-width="1.5"/></marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#565656" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="702" rx="24" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/>
  <text x="56" y="52" fill="#ee0000" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start">PREFILL / DECODE DISAGGREGATION</text>
  <text x="56" y="91" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">Follow one request through separate workers</text>
  <text x="56" y="119" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">The decode-side sidecar coordinates the handoff; bulk KV data moves between workers.</text>
  <line x1="56" y1="143" x2="1144" y2="143" stroke="#ee0000" stroke-width="3"/>
  <rect x="56" y="176" width="220" height="104" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="88" cy="208" r="18" fill="#151515"/><text x="88" y="213" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text><text x="118" y="214" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Client</text><text x="80" y="248" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Send request</text><rect x="360" y="176" width="270" height="104" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="392" cy="208" r="18" fill="#151515"/><text x="392" y="213" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">02</text><text x="422" y="214" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Proxy</text><text x="384" y="248" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Consult EPP; route request</text><rect x="752" y="176" width="392" height="104" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="784" cy="208" r="18" fill="#151515"/><text x="784" y="213" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">03</text><text x="814" y="214" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Decode-side sidecar</text><text x="776" y="248" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Coordinate remote prefill</text><path d="M276 222H354" fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/><path d="M630 222H746" fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/><rect x="360" y="324" width="270" height="94" rx="14" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="384" y="361" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">Endpoint picker (EPP)</text><text x="384" y="390" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Select P and D endpoints</text><path d="M430 280V318" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><path d="M567 324V286" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><text x="443" y="311" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Consult / decision</text><rect x="752" y="478" width="392" height="144" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="784" cy="510" r="18" fill="#151515"/><text x="784" y="515" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">05</text><text x="814" y="516" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Decode worker</text><text x="776" y="550" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Retrieve the prefiller&#x27;s KV state</text><text x="776" y="574" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Use it to generate the answer</text><rect x="56" y="478" width="420" height="144" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="88" cy="510" r="18" fill="#151515"/><text x="88" y="515" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">04</text><text x="118" y="516" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Prefill worker</text><text x="80" y="550" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Process the prompt</text><text x="80" y="574" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Build KV state; return metadata</text><path d="M842 280V446H266V472" fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/><text x="282" y="435" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Remote prefill request · metadata returns to the sidecar</text><path d="M1070 280V472" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><text x="920" y="390" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Decode request</text><text x="920" y="414" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">+ transfer metadata</text><path d="M476 559H746" fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/><text x="520" y="532" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Bulk KV state · NIXL</text><text x="501" y="597" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Decoder retrieves the state</text><path d="M1114 478V286" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)" stroke-dasharray="7 6"/><path d="M752 267H636" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)" stroke-dasharray="7 6"/><path d="M360 267H282" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)" stroke-dasharray="7 6"/><text x="56" y="337" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Streamed answer</text><text x="56" y="364" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Returns through sidecar</text><text x="56" y="389" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">and proxy to the client</text><text x="56" y="668" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Solid: request coordination and KV handoff. Dashed: response path. Layout is conceptual.</text>
</svg>
