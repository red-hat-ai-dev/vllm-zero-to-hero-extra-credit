<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title description">
  <title id="title">Choose which kind of capacity you need</title>
  <desc id="description">Three panels distinguish independent dense-model replicas, dedicated prefill and decode workers with KV transfer, and tensor shards across GPUs cooperating in one model replica. The patterns can be combined and do not guarantee proportional speedup.</desc>
  <defs>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ee0000" stroke-width="1.5"/></marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#565656" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="668" rx="24" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/>
  <text x="56" y="52" fill="#ee0000" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start">SCALING PATTERNS</text>
  <text x="56" y="91" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">Choose which kind of capacity you need</text>
  <text x="56" y="119" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">More replicas, separate serving phases, and model parallelism solve different problems.</text>
  <line x1="56" y1="143" x2="1144" y2="143" stroke="#ee0000" stroke-width="3"/>
  <rect x="56" y="178" width="340" height="140" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="88" cy="210" r="18" fill="#151515"/><text x="88" y="215" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text><text x="118" y="216" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Add replicas</text><text x="80" y="250" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Same model, more destinations</text><text x="80" y="274" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Different requests run in parallel</text><rect x="430" y="178" width="340" height="140" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="462" cy="210" r="18" fill="#151515"/><text x="462" y="215" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">02</text><text x="492" y="216" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Separate phases</text><text x="454" y="250" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Dedicated prefill and decode</text><text x="454" y="274" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Transfer KV state between them</text><rect x="804" y="178" width="340" height="140" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="836" cy="210" r="18" fill="#151515"/><text x="836" y="215" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">03</text><text x="866" y="216" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Split model work</text><text x="828" y="250" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Accelerators cooperate</text><text x="828" y="274" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Example: tensor parallelism</text><rect x="96" y="359" width="260" height="43" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="119" y="387" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Replica A · model copy</text><rect x="96" y="418" width="260" height="43" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="119" y="446" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Replica B · model copy</text><rect x="96" y="477" width="260" height="43" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="119" y="505" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Replica C · model copy</text><rect x="470" y="359" width="260" height="65" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="494" y="398" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Prefill workers</text><rect x="470" y="477" width="260" height="65" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="494" y="516" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Decode workers</text><path d="M600 424V471" fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/><text x="622" y="455" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">KV</text><rect x="828" y="341" width="292" height="218" rx="14" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="852" y="373" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">One model replica</text><rect x="852" y="400" width="244" height="52" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="874" y="433" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">GPU A · tensor shard</text><rect x="852" y="486" width="244" height="52" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="874" y="519" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">GPU B · tensor shard</text><path d="M931 452V480" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><path d="M1010 486V458" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><text x="80" y="591" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Grow request capacity</text><text x="454" y="591" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Balance phase capacity</text><text x="828" y="591" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Fit and execute a model</text><text x="56" y="635" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">These patterns can be combined. A replica can itself use multiple accelerators.</text>
</svg>
