<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">Reuse the prompt work without ignoring load</title>
  <desc id="description">The incoming prompt has a shared prefix and a new question. Worker A has the prefix and moderate load; B has no matching prefix and light load; C has the prefix and heavy load. A is an illustrative choice only; configured scheduling policy determines the actual endpoint.</desc>
  <defs>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ee0000" stroke-width="1.5"/></marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#565656" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="658" rx="24" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/>
  <text x="56" y="52" fill="#ee0000" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start">INFERENCE-AWARE ROUTING</text>
  <text x="56" y="91" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">Reuse the prompt work without ignoring load</text>
  <text x="56" y="119" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">A cached prefix can save prefill work, but waiting on a busy worker also has a cost.</text>
  <line x1="56" y1="143" x2="1144" y2="143" stroke="#ee0000" stroke-width="3"/>
  <rect x="56" y="175" width="1088" height="78" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="80" y="205" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Incoming prompt</text><rect x="328" y="189" width="480" height="47" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="352" y="219" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Shared instructions and document</text><rect x="828" y="189" width="292" height="47" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="852" y="219" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">New question</text><rect x="426" y="286" width="348" height="102" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="458" cy="318" r="18" fill="#151515"/><text x="458" y="323" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text><text x="488" y="324" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Endpoint picker</text><text x="450" y="358" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Consider cache affinity and load</text><path d="M600 253V280" fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/><path d="M600 388V410H226V432" fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/><path d="M600 388V432" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><path d="M600 410H974V432" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><rect x="56" y="438" width="340" height="148" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="80" y="471" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Worker A</text><text x="80" y="503" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Shared prefix cached</text><text x="80" y="528" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Moderate load</text><text x="80" y="553" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Can reuse prefix computation</text><rect x="430" y="438" width="340" height="148" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="454" y="471" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Worker B</text><text x="454" y="503" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">No matching prefix cached</text><text x="454" y="528" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Light load</text><text x="454" y="553" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Needs to process the prompt</text><rect x="804" y="438" width="340" height="148" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="828" y="471" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Worker C</text><text x="828" y="503" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Shared prefix cached</text><text x="828" y="528" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Heavy load</text><text x="828" y="553" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Reuse may cost a longer wait</text><text x="56" y="624" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Illustrative choice: A can save work if its load is acceptable. Policy decides the tradeoff.</text>
</svg>
