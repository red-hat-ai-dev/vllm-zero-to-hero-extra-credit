<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">One entry point, a pool of model servers</title>
  <desc id="description">The client sends an API request to a proxy. The proxy consults the endpoint picker and forwards the request to worker A. Three vLLM workers belong to an InferencePool. Metrics inform the picker; it does not execute the model.</desc>
  <defs>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ee0000" stroke-width="1.5"/></marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#565656" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="598" rx="24" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/>
  <text x="56" y="52" fill="#ee0000" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start">LLM-D ARCHITECTURE</text>
  <text x="56" y="91" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">One entry point, a pool of model servers</text>
  <text x="56" y="119" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">The proxy forwards requests; the endpoint picker chooses where they go.</text>
  <line x1="56" y1="143" x2="1144" y2="143" stroke="#ee0000" stroke-width="3"/>
  <rect x="56" y="206" width="190" height="100" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="88" cy="238" r="18" fill="#151515"/><text x="88" y="243" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text><text x="118" y="244" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Client</text><text x="80" y="278" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Send an API request</text><rect x="308" y="206" width="248" height="100" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="340" cy="238" r="18" fill="#151515"/><text x="340" y="243" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">02</text><text x="370" y="244" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Proxy</text><text x="332" y="278" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Forward to the worker</text><rect x="674" y="175" width="470" height="354" rx="14" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="698" y="204" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">InferencePool · same base model</text><rect x="700" y="224" width="418" height="76" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="724" y="255" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">vLLM worker A</text><text x="724" y="280" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Model execution on accelerator(s)</text><rect x="700" y="326" width="418" height="76" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="724" y="357" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">vLLM worker B</text><text x="724" y="382" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Model execution on accelerator(s)</text><rect x="700" y="428" width="418" height="76" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="724" y="459" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">vLLM worker C</text><text x="724" y="484" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Model execution on accelerator(s)</text><rect x="308" y="399" width="248" height="100" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="340" cy="431" r="18" fill="#151515"/><text x="340" y="436" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">03</text><text x="370" y="437" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Endpoint picker</text><text x="332" y="471" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Choose a destination</text><path d="M246 256H302" fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/><path d="M556 256H694" fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/><text x="586" y="234" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Request</text><path d="M360 306V393" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><path d="M505 399V312" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><text x="374" y="347" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Consult</text><text x="433" y="372" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Decision</text><path d="M674 476H620V449H562" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)" stroke-dasharray="7 6"/><text x="574" y="420" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Metrics</text><text x="56" y="568" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Kubernetes manages pods and resources. vLLM generates the tokens.</text>
</svg>
