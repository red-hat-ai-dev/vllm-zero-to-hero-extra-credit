<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Read the prompt, then generate the answer</title>
  <desc id="description">Prefill processes prompt tokens and builds a KV cache. Decode uses and extends that cache to generate output tokens. Words represent tokens conceptually; actual tokenizer boundaries vary. The two phases need not run on separate workers.</desc>
  <defs>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ee0000" stroke-width="1.5"/></marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#565656" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="518" rx="24" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/>
  <text x="56" y="52" fill="#ee0000" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start">TWO PHASES</text>
  <text x="56" y="91" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">Read the prompt, then generate the answer</text>
  <text x="56" y="119" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">The KV cache preserves attention state from tokens the model has already processed.</text>
  <line x1="56" y1="143" x2="1144" y2="143" stroke="#ee0000" stroke-width="3"/>
  <rect x="56" y="179" width="440" height="178" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="88" cy="211" r="18" fill="#151515"/><text x="88" y="216" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text><text x="118" y="217" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Prefill</text><text x="80" y="251" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Process the input prompt</text><text x="80" y="275" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Build attention state in the KV cache</text><text x="80" y="299" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Often compute-bound for long prompts</text><rect x="704" y="179" width="440" height="178" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="736" cy="211" r="18" fill="#151515"/><text x="736" y="216" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">02</text><text x="766" y="217" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Decode</text><text x="728" y="251" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Generate the output tokens</text><text x="728" y="275" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Use and extend the KV cache</text><text x="728" y="299" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Often memory-bandwidth-bound</text><path d="M496 269H698" fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/><text x="548" y="245" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">KV state</text><text x="80" y="391" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Prompt tokens</text><rect x="80" y="409" width="90" height="36" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="125" y="433" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Explain</text><rect x="181" y="409" width="90" height="36" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="226" y="433" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">how</text><rect x="282" y="409" width="90" height="36" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="327" y="433" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">llm-d</text><rect x="383" y="409" width="90" height="36" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="428" y="433" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">works</text><text x="728" y="391" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">Output tokens · conceptual word-sized example</text><rect x="728" y="409" width="118" height="36" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="787" y="433" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">llm-d</text><rect x="862" y="409" width="118" height="36" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="921" y="433" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">routes</text><rect x="996" y="409" width="118" height="36" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="1055" y="433" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle">inference</text><text x="56" y="485" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Both phases can run in one worker. Separating them is an optional serving pattern.</text>
</svg>
