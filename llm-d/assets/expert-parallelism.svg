<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title description">
  <title id="title">Move tokens to experts, then combine the results</title>
  <desc id="description">During an MoE model pass, attention produces token activations. The model router selects illustrative experts 1 and 3 on different accelerators. Activations are dispatched to those experts and the outputs combined back to the original attention rank. This is distinct from HTTP request routing and prefill/decode KV transfer.</desc>
  <defs>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ee0000" stroke-width="1.5"/></marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#565656" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="778" rx="24" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/>
  <text x="56" y="52" fill="#ee0000" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start">WIDE EXPERT PARALLELISM</text>
  <text x="56" y="91" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">Move tokens to experts, then combine the results</text>
  <text x="56" y="119" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Selected experts execute on the accelerators that hold their weights.</text>
  <line x1="56" y1="143" x2="1144" y2="143" stroke="#ee0000" stroke-width="3"/>
  <rect x="56" y="181" width="250" height="110" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="88" cy="213" r="18" fill="#151515"/><text x="88" y="218" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text><text x="118" y="219" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Attention</text><text x="80" y="253" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Token activation</text><rect x="374" y="181" width="358" height="110" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="406" cy="213" r="18" fill="#151515"/><text x="406" y="218" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">02</text><text x="436" y="219" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Model&#x27;s MoE router</text><text x="398" y="253" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Choose a subset of experts</text><path d="M306 234H368" fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/><rect x="56" y="346" width="500" height="150" rx="14" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="80" y="377" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Accelerator A</text><rect x="80" y="397" width="210" height="65" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="103" y="435" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Expert 1 · selected</text><rect x="310" y="397" width="220" height="65" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="333" y="435" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Expert 2 · not used</text><rect x="644" y="346" width="500" height="150" rx="14" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/><text x="668" y="377" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Accelerator B</text><rect x="668" y="397" width="210" height="65" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="691" y="435" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Expert 3 · selected</text><rect x="898" y="397" width="220" height="65" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="921" y="435" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Expert 4 · not used</text><path d="M480 291V319H270V391" fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/><path d="M626 291V319H862V391" fill="none" stroke="#ee0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red-arrow)"/><text x="788" y="270" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Dispatch token activations</text><rect x="426" y="566" width="348" height="112" rx="14" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><circle cx="458" cy="598" r="18" fill="#151515"/><text x="458" y="603" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">03</text><text x="488" y="604" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Combine</text><text x="450" y="638" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">Return to the attention rank</text><path d="M185 462V528H500V560" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><path d="M773 462V528H688V560" fill="none" stroke="#565656" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><text x="56" y="720" fill="#151515" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">Internal model routing selects experts. The llm-d EPP selects HTTP serving endpoints.</text><text x="56" y="745" fill="#565656" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start">Two of four experts are shown for illustration; the real count and selection depend on the model.</text>
</svg>
